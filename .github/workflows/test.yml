name: Offline identity protocol
on: [push, pull_request]
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/owner-identity.cjs
      - run: node --check web/app.js && node --check web/identity-client.js
      - run: python -m pip install PyYAML
      - run: python tools/check_package.py
