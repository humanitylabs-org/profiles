<!doctype html>
<html lang="en" data-app="profiles">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Profiles</title>
  <script src="boot.js"></script>
  <link rel="stylesheet" href="wizard-ui.css">
  <link rel="stylesheet" href="/wizard-os-home/core/sigils.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="/wizard-os-home/core/sigils.js"></script>
  <script defer src="theme-client.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="wz-app pf-root">
    <header class="wz-head"><h1 id="title">Profile</h1><p id="sub"></p></header>
    <main class="wz-scroll pf-scroll" id="scroll">
      <section id="tryon" class="pf-tryon" hidden></section>
      <section id="view-me" class="pf-view" aria-label="Your profile"></section>
      <section id="view-friends" class="pf-view" aria-label="Friends" hidden></section>
      <section id="view-friend" class="pf-view" aria-label="Friend's profile" hidden></section>
    </main>
    <p id="status" class="wz-status wz-sr" role="status" aria-live="polite"></p>
    <nav class="pf-tabs" aria-label="Profiles">
      <button type="button" data-tab="me" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.6 3.8-5.5 7-5.5s5.8 1.9 7 5.5"/></svg><span>You</span></button>
      <button type="button" data-tab="friends"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="3"/><circle cx="17" cy="10" r="2.4"/><path d="M3.5 19c.9-3 3-4.6 5.5-4.6s4.6 1.6 5.5 4.6M15 15.2c2.6-.4 4.6 1 5.5 3.8"/></svg><span>Friends</span><i id="req-dot" hidden></i></button>
    </nav>
  </div>
</body>
</html>
